schema_version: 1

context:
  name: squadgen
  version: "1.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/ClimateGlobalChange/squadgen/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 50ef6550ca6a245e75c5d594fee9fe5f51f94656ee37ebda968b963bf1b05bed
  patches:
    - 0001-remove-png-h.patch

build:
  number: 3
  skip: not linux

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - cmake
    - make
  host:
    - libnetcdf
    - libnetcdf * nompi_*

tests:
  - files:
      recipe:
        - test/grid.png
    script:
      - SQuadGen --refine_file test/grid.png --refine_level 5 --refine_type LOWCONN --resolution 30 --smooth_type SPRING --smooth_dist 3 --smooth_iter 20 --output grid.g
      - test -f "grid.g"

about:
  license: GPL-2.0-or-later and NetCDF and Zlib
  license_file:
    - LICENSE.md
    - src/netcdf-cxx-4.2.COPYRIGHT
    - src/lodepng.h
  summary: Spherical Quadrilateral Mesh Generator (SQuadGen)
  homepage: https://github.com/ClimateGlobalChange/squadgen
  repository: https://github.com/ClimateGlobalChange/squadgen
  documentation: https://github.com/ClimateGlobalChange/squadgen/blob/master/README.md

extra:
  recipe-maintainers:
    - xylar
